version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Versions live in Directory.Packages.props.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tests:
        patterns: ['xunit*', 'Microsoft.NET.Test.Sdk', 'coverlet.*']
      # The runtime and the generator of the protobuf code move together.
      protobuf:
        patterns: ['Google.Protobuf', 'Grpc.Tools']

  # global.json pins the SDK feature band, which also fixes the formatter CI checks the layout with; a new band
  # arrives as its own pull request, so a formatter change shows up there and not on an unrelated one.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
