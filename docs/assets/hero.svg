  </defs>
  <rect width="1200" height="400" rx="16" fill="url(#sky)"/>
  <rect width="1200" height="400" rx="16" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#d8b46a"/>
