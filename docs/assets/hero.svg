    <polygon points="0,-62 -10,-8 0,62 10,-8" fill="#ffe7a3" opacity=".55"/>
  </g>
  <text x="600" y="246" text-anchor="middle" font-family="Cinzel, 'Trajan Pro', Georgia, 'Times New Roman', serif" font-weight="700" font-size="84" letter-spacing="6" fill="#f3e3b8">RO3Emu</text>
  <text x="600" y="300" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-weight="600" font-size="30" fill="#e6edf3">Play Ragnarok Online 3 on your own server</text>
  <text x="600" y="342" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="19" fill="#a9b4c7">Free and open source · one click on Windows · host for your friends</text>
