message DBFriendSystemInfoIncrement {
  message groupIdsRepeatedOrigin {
    repeated string value = 1;
  }

  message groupIdsRepeatedIncrement {
    repeated string value = 1;
  }

  message groupIdsFieldIncrement {
    oneof value {
      romsg.DBFriendSystemInfoIncrement.groupIdsRepeatedOrigin all = 1;
      romsg.DBFriendSystemInfoIncrement.groupIdsRepeatedIncrement inc = 2;
    }
  }

  message recentlyChatsFieldIncrement {
    oneof value {
      romsg.FriendChatRecordList all = 1;
      romsg.FriendChatRecordListIncrement inc = 2;
    }
  }

  message topChatsFieldIncrement {
    oneof value {
      romsg.FriendChatRecordList all = 1;
      romsg.FriendChatRecordListIncrement inc = 2;
    }
  }

  message friendPartitionsFieldIncrement {
    oneof value {
      romsg.FriendGroupList all = 1;
      romsg.FriendGroupListIncrement inc = 2;
    }
  }

  message sendGiftRecordsRepeatedOrigin {
    repeated romsg.FriendGiftRecord value = 1;
  }

  message sendGiftRecordsRepeatedIncrement {
    repeated romsg.FriendGiftRecordIncrement value = 1;
  }

  message sendGiftRecordsFieldIncrement {
    oneof value {
      romsg.DBFriendSystemInfoIncrement.sendGiftRecordsRepeatedOrigin all = 1;
      romsg.DBFriendSystemInfoIncrement.sendGiftRecordsRepeatedIncrement inc = 2;
    }
  }

  message receiveGiftRecordsRepeatedOrigin {
    repeated romsg.FriendGiftRecord value = 1;
  }

  message receiveGiftRecordsRepeatedIncrement {
    repeated romsg.FriendGiftRecordIncrement value = 1;
  }

  message receiveGiftRecordsFieldIncrement {
    oneof value {
      romsg.DBFriendSystemInfoIncrement.receiveGiftRecordsRepeatedOrigin all = 1;
      romsg.DBFriendSystemInfoIncrement.receiveGiftRecordsRepeatedIncrement inc = 2;
    }
  }

  message recentlyDataFieldIncrement {
    oneof value {
      romsg.FriendChatRecordList all = 1;
      romsg.FriendChatRecordListIncrement inc = 2;
    }
  }

  message ownerGroupIdsRepeatedOrigin {
    repeated string value = 1;
  }

  message ownerGroupIdsRepeatedIncrement {
    repeated string value = 1;
  }

  message ownerGroupIdsFieldIncrement {
    oneof value {
      romsg.DBFriendSystemInfoIncrement.ownerGroupIdsRepeatedOrigin all = 1;
      romsg.DBFriendSystemInfoIncrement.ownerGroupIdsRepeatedIncrement inc = 2;
    }
  }

  romsg.DBFriendSystemInfoIncrement.groupIdsFieldIncrement groupIds = 10;
  romsg.DBFriendSystemInfoIncrement.recentlyChatsFieldIncrement recentlyChats = 20;
  romsg.DBFriendSystemInfoIncrement.topChatsFieldIncrement topChats = 30;
  romsg.DBFriendSystemInfoIncrement.friendPartitionsFieldIncrement friendPartitions = 40;
  romsg.DBFriendSystemInfoIncrement.sendGiftRecordsFieldIncrement sendGiftRecords = 50;
  romsg.DBFriendSystemInfoIncrement.receiveGiftRecordsFieldIncrement receiveGiftRecords = 60;
  romsg.DBFriendSystemInfoIncrement.recentlyDataFieldIncrement recentlyData = 70;
  romsg.DBFriendSystemInfoIncrement.ownerGroupIdsFieldIncrement ownerGroupIds = 80;
}

message FriendChatListItemIncrement {
  optional romsg.FriendChatType type = 10;
  optional int64 roleId = 20;
  optional string groupId = 30;
}

message FriendChatRecordListIncrement {
  message itemsRepeatedOrigin {
    repeated romsg.FriendChatListItem value = 1;
  }

  message itemsRepeatedIncrement {
    repeated romsg.FriendChatListItemIncrement value = 1;
  }

  message itemsFieldIncrement {
    oneof value {
      romsg.FriendChatRecordListIncrement.itemsRepeatedOrigin all = 1;
      romsg.FriendChatRecordListIncrement.itemsRepeatedIncrement inc = 2;
    }
  }

  romsg.FriendChatRecordListIncrement.itemsFieldIncrement items = 10;
}

message FriendGiftRecordIncrement {
  optional int64 sender = 10;
  optional int64 receiver = 20;
  optional int64 itemId = 30;
  optional int32 count = 40;
  optional bool isAnonymous = 50;
  optional string message = 60;
  optional int64 sendTime = 70;
  optional int32 affection = 80;
  optional int32 popularity = 90;
  optional int32 intimacy = 100;
}

message FriendGroupIncrement {
  message memberListRepeatedOrigin {
    repeated int64 value = 1;
  }

  message memberListRepeatedIncrement {
    repeated int64 value = 1;
  }

  message memberListFieldIncrement {
    oneof value {
      romsg.FriendGroupIncrement.memberListRepeatedOrigin all = 1;
      romsg.FriendGroupIncrement.memberListRepeatedIncrement inc = 2;
    }
  }

  optional string groupName = 10;
  romsg.FriendGroupIncrement.memberListFieldIncrement memberList = 20;
}

message FriendGroupListIncrement {
  message customGroupListRepeatedOrigin {
    repeated romsg.FriendGroup value = 1;
  }

  message customGroupListRepeatedIncrement {
    repeated romsg.FriendGroupIncrement value = 1;
  }

  message customGroupListFieldIncrement {
    oneof value {
      romsg.FriendGroupListIncrement.customGroupListRepeatedOrigin all = 1;
      romsg.FriendGroupListIncrement.customGroupListRepeatedIncrement inc = 2;
    }
  }

  romsg.FriendGroupListIncrement.customGroupListFieldIncrement customGroupList = 10;
}

