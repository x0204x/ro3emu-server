syntax = "proto3";
package romsg;
import "FieldOption.proto";
option optimize_for = LITE_RUNTIME;
option go_package = "./romsg";
option cc_generic_services = false;

enum FlyingDragonProductStatus {
  FlyingDragonProductStatusIdle = 0;
  FlyingDragonProductStatusProduct = 1;
  FlyingDragonProductStatusCeremony = 2;
}

message FlyingDragonStartProduceReq {
  int32 extraRewardIndex = 1;
}

message FlyingDragonStartProduceRes {
  int32 result = 1;
}

message FlyingDragonAssistProduceReq {
  int32 placeHolder = 1;
}

message FlyingDragonAssistProduceRes {
  int32 result = 1;
}

message FlyingDragonQueryProduceReq {
  int32 placeHolder = 1;
}

message FlyingDragonQueryProduceRes {
  romsg.FlyingDragonProduceInfo info = 1;
}

message FlyingDragonProduceInfo {
  romsg.FlyingDragonProductStatus status = 1;
  oneof ProduceProcessData {
    romsg.ProductInfo productInfo = 2;
    romsg.CeremonyInfo ceremonyInfo = 3;
  }
  int64 ProcessUniqueId = 4;
  int64 OwnerRoleId = 5;
}

message ProductInfo {
  int32 ReleaseProgress = 1;
  int64 ProcessEndTimeStamp = 2;
  bool HasAssisted = 3;
  int32 ExtraRewardIndex = 4;
}

message CeremonyInfo {
  bool CanThumbsUp = 1;
  int64 ThumbsUpEndTimeStamp = 2;
  bool IsAlreadyThumbsUp = 3;
  int64 CeremonyStartTime = 4;
}

message FlyingDragonSelfAccelerateReq {
  int32 placeHolder = 1;
}

message FlyingDragonSelfAccelerateRes {
  int32 result = 1;
}

message FlyingDragonCompleteProduceReq {
  int32 placeHolder = 1;
}

message FlyingDragonCompleteProduceRes {
  int32 result = 1;
}

message FlyingDragonCeremonyThumbsUpReq {
  int32 placeHolder = 1;
}

message FlyingDragonCeremonyThumbsUpRes {
  int32 result = 1;
}

message FlyingDragonProductNotify {
  romsg.FlyingDragonProduceInfo info = 1;
}

message DBProductInfo {
  int32 ReleaseProgress = 1 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  int64 ProcessEndTimeStamp = 2 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  map<int64, bool> AssistantRoles = 3 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  int32 ExtraRewardIndex = 4 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  map<int32, int32> OriItems = 5 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  bool HasSelfAccelerate = 6 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
}

message DBCeremonyInfo {
  bool CanThumbsUp = 1 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  int64 ThumbsUpEndTimeStamp = 2 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  map<int64, bool> ThumbsUpRoles = 3 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  int64 CeremonyStartTime = 4 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
}

message DBFlyingDragonProduceInfo {
  romsg.DBProductInfo productInfo = 1 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  romsg.DBCeremonyInfo ceremonyInfo = 2 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  int64 ProcessUniqueId = 3 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  int64 OwnerRoleId = 4 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  map<int64, int64> StartRoles = 5 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
}

