message QuickUseSaveInfo {
  int32 lieQuickUse = 1 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  int32 itemEntry = 2 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
}

message ArrangeItemReq {
  romsg.PackType packType = 1;
}

message ArrangeItemRes {
  int32 result = 1;
  romsg.ArrangeItemReq req = 2;
}

message QuickUseSaveReq {
  int32 lieQuickUse = 1;
  int32 entryItem = 2;
}

message QuickUseSaveRes {
  int32 result = 1;
  repeated romsg.QuickUseSaveInfo quick_save_infos = 2;
}

message ShortcutBarInfo {
  int32 slotIndex = 1 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  int64 itemGuid = 2 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
}

message ShortcutBarSaveReq {
  int32 slotIndex = 1;
  int64 itemGuid = 2;
}

message ShortcutBarSaveRes {
  int32 result = 1;
}

message ShortcutBarUseReq {
  int32 slotIndex = 1;
}

message ShortcutBarUseRes {
  int32 result = 1;
  int32 slotIndex = 2;
}

message CareerSpecialTransferItemsReq {
  romsg.CareerSpecialTransferItemsType transType = 1;
  map<int64, int64> itemGuidCountMap = 2;
}

message CareerSpecialTransferItemsRsp {
  int32 result = 1;
}

message NotifyCareerSpecialPackSizeChange {
  int32 size = 1;
}

message SendItemCds {
  map<int64, int64> itemCds = 1;
  map<int64, int64> shareCds = 2;
}

message MedicinesAutoUse {
  bool isOpen = 1 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  int32 condition = 2 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  repeated int32 itemEntrys = 3 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
}

message MedicinesAutoUseSet {
  romsg.MedicinesAutoUse hpConfig = 1 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  romsg.MedicinesAutoUse spConfig = 2 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
}

message MedicinesAutoUseSetReq {
  romsg.MedicineAutoUseType type = 1;
  romsg.MedicineAutoUseOpType opType = 2;
  romsg.MedicinesAutoUse setData = 3;
}

message MedicinesAutoUseSetResp {
  int32 result = 1;
  romsg.MedicineAutoUseType type = 2;
  romsg.MedicinesAutoUse setData = 3;
}

message ItemUseParamInfo {
  message SelfChoosePet {
    map<int32, int32> choosePet = 1;
  }

  message SelfChooseGift {
    map<int32, int32> chooseGift = 1;
  }

  message ButterflyWings {
    int32 mapId = 1;
  }

  message UnlockMount {
    int32 mountId = 1;
    int32 mountTime = 2;
    bool firstUnlockMount = 3;
  }

  oneof var {
    romsg.ItemUseParamInfo.SelfChooseGift selfChooseGift = 1;
    romsg.ItemUseParamInfo.ButterflyWings butterflyWings = 2;
    romsg.ItemUseParamInfo.UnlockMount unlockMount = 3;
    romsg.ItemUseParamInfo.SelfChoosePet selfChoosePet = 4;
    romsg.ChatCustomizeDada chatCustomizeData = 5;
    bool isFirstHeartBox = 6;
  }
}

message ItemUseReq {
  int64 itemGuid = 1;
  int32 itemCount = 2;
  repeated romsg.ItemUseParamInfo itemParam = 3;
}

message ItemUseResp {
  int32 result = 1;
  int64 itemGuid = 2;
  int32 itemCount = 3;
  int32 itemId = 4;
  int64 itemCd = 5;
  int64 shareCd = 6;
  int32 itemTimes = 7;
  repeated romsg.ItemUseParamInfo itemParam = 8;
}

message ItemCDInfo {
  int32 itemId = 1;
  int64 itemCd = 2;
  int64 shareCd = 3;
}

message ItemsCDNotify {
  repeated romsg.ItemCDInfo items = 1;
}

message ItemArrowSwitchReq {
  int32 itemId = 1;
}

message ItemArrowSwitchResp {
  int32 result = 1;
  int32 itemId = 2;
  int32 itemCount = 3;
}

message ItemCombineReq {
  map<int32, int32> costItem = 1;
  int32 itemId = 2;
  int32 itemCount = 3;
}

message ItemCombineResp {
  int32 result = 1;
}

message ItemDecomposeReq {
  map<int64, int32> decomposeItem = 1;
  bool isLapseDecompose = 3;
}

message ItemDecomposeResp {
  int32 result = 1;
}

message AutoDecomposeSetting {
  map<int32, romsg.ItemAutoDecomposeSettingReq> tabOptionSetting = 1 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
}

message OptionGroup {
  repeated int32 options = 1 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
}

message ItemAutoDecomposeSettingReq {
  int32 tabId = 1 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  map<int32, romsg.OptionGroup> optionSetting = 2 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  bool isOpen = 3 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
}

message ItemAutoDecomposeSettingResp {
  int32 result = 1;
}

message ItemLockDecomposeReq {
  int64 itemGuid = 1;
  bool isLocked = 2;
}

message ItemLockDecomposeResp {
  int32 result = 1;
  int64 itemGuid = 2;
  bool isLocked = 3;
}

message ItemAutoDecomposeGainItems {
  map<int32, int32> itemInfo = 1;
}

message ItemAutoDecomposeTipsNtf {
  map<int32, int32> decomposeItemInfo = 1;
  map<int32, romsg.ItemAutoDecomposeGainItems> decomposeGainItemInfo = 2;
}

