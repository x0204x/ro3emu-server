syntax = "proto3";
package romsg;
option optimize_for = LITE_RUNTIME;
option go_package = "./romsg";
option cc_generic_services = false;

message PublicChatNewEmojiNtf {
  repeated int64 ids = 1;
}

message PublicChatEmojiReq {
}

message PublicChatEmojiRsp {
  repeated int64 ids = 1;
}

message DungeonEmojiInstallReq {
  int32 dungeonId = 1;
  repeated int32 emojiIds = 2;
}

message DungeonEmojiInstallResp {
  int32 result = 1;
}

