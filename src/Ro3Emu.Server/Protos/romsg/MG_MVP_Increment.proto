option optimize_for = LITE_RUNTIME;
option cc_generic_services = false;

message MVPInfoIncrement {
  message player_infoFieldIncrement {
    oneof value {
      romsg.MVPPlayerStatisticsInfo all = 1;
      romsg.MVPPlayerStatisticsInfoIncrement inc = 2;
      bool del = 3;
    }
  }

  message dead_msRepeatedOrigin {
    repeated int64 value = 1;
  }

  message dead_msRepeatedIncrement {
    repeated int64 value = 1;
  }

  message dead_msFieldIncrement {
    oneof value {
      romsg.MVPInfoIncrement.dead_msRepeatedOrigin all = 1;
      romsg.MVPInfoIncrement.dead_msRepeatedIncrement inc = 2;
    }
  }

  optional int64 server_open_time = 20;
  optional int64 cfg_id = 30;
  optional int32 level = 40;
  optional int64 map_id = 50;
  optional int64 hp = 60;
  optional int64 max_hp = 70;
  optional romsg.MVP_STATE state = 80;
  optional int64 change_time = 90;
  optional int64 first_player_id = 100;
  optional int64 end_player_id = 110;
  map<int64, romsg.MVPInfoIncrement.player_infoFieldIncrement> player_info = 120;
  optional int64 create_time = 130;
  optional int64 seasonArea = 150;
  romsg.MVPInfoIncrement.dead_msFieldIncrement dead_ms = 160;
}

message MVPPlayerAwardItemIncrement {
  optional int64 item_id = 10;
  optional int64 count = 20;
  optional romsg.MVP_AWARD_TYPE tp = 30;
}

message MVPPlayerInfoIncrement {
  optional int64 player_id = 10;
  optional int64 first_num = 20;
  optional int64 end_num = 30;
  optional int64 join_num = 40;
  optional int64 team_num = 50;
  optional int64 last_time = 60;
}

message MVPPlayerStatisticsInfoIncrement {
  message paramsFieldIncrement {
    oneof value {
      romsg.AwardConditionParam all = 1;
      romsg.AwardConditionParamIncrement inc = 2;
    }
  }

  optional int64 player_id = 10;
  optional int64 team_id = 20;
  optional int32 team_idx = 30;
  optional int64 attack = 40;
  optional int64 attack_time = 50;
  optional int64 be_attack = 60;
  optional int64 be_attack_time = 70;
  optional int64 cure = 80;
  optional int64 cure_time = 90;
  optional int64 dead = 100;
  optional int32 level = 110;
  optional int32 job = 120;
  romsg.MVPPlayerStatisticsInfoIncrement.paramsFieldIncrement params = 130;
  optional int64 sceneEntryId = 140;
  optional int32 lineId = 150;
}

message MVPReportPlayerInfoIncrement {
  message itemsRepeatedOrigin {
    repeated romsg.MVPPlayerAwardItem value = 1;
  }

  message itemsRepeatedIncrement {
    repeated romsg.MVPPlayerAwardItemIncrement value = 1;
  }

  message itemsFieldIncrement {
    oneof value {
      romsg.MVPReportPlayerInfoIncrement.itemsRepeatedOrigin all = 1;
      romsg.MVPReportPlayerInfoIncrement.itemsRepeatedIncrement inc = 2;
    }
  }

  optional int64 player_id = 10;
  romsg.MVPReportPlayerInfoIncrement.itemsFieldIncrement items = 20;
  optional int64 param1 = 30;
  optional int64 param2 = 40;
}

message MVPReportRankInfoIncrement {
  message teamsRepeatedOrigin {
    repeated romsg.MVPReportTeamInfo value = 1;
  }

  message teamsRepeatedIncrement {
    repeated romsg.MVPReportTeamInfoIncrement value = 1;
  }

  message teamsFieldIncrement {
    oneof value {
      romsg.MVPReportRankInfoIncrement.teamsRepeatedOrigin all = 1;
      romsg.MVPReportRankInfoIncrement.teamsRepeatedIncrement inc = 2;
    }
  }

  optional int64 cfg_id = 10;
  optional romsg.MVPRankType tp = 20;
  optional int64 first_player_id = 30;
  optional int64 end_player_id = 40;
  optional int64 time_stamp = 50;
  romsg.MVPReportRankInfoIncrement.teamsFieldIncrement teams = 60;
  optional int64 dead_ms = 70;
  optional int64 rare_player_id = 80;
  optional int64 rare_team_id = 90;
}

message MVPReportTeamInfoIncrement {
  message playersRepeatedOrigin {
    repeated romsg.MVPReportPlayerInfo value = 1;
  }

  message playersRepeatedIncrement {
    repeated romsg.MVPReportPlayerInfoIncrement value = 1;
  }

  message playersFieldIncrement {
    oneof value {
      romsg.MVPReportTeamInfoIncrement.playersRepeatedOrigin all = 1;
      romsg.MVPReportTeamInfoIncrement.playersRepeatedIncrement inc = 2;
    }
  }

  optional int64 team_id = 10;
  optional int64 leader_id = 20;
  romsg.MVPReportTeamInfoIncrement.playersFieldIncrement players = 30;
  optional int64 param1 = 40;
  optional int64 param2 = 50;
}

