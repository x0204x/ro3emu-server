message BlackMarketGlobalDataIncrement {
  message samplePricesRepeatedOrigin {
    repeated int64 value = 1;
  }

  message samplePricesRepeatedIncrement {
    repeated int64 value = 1;
  }

  message samplePricesFieldIncrement {
    oneof value {
      romsg.BlackMarketGlobalDataIncrement.samplePricesRepeatedOrigin all = 1;
      romsg.BlackMarketGlobalDataIncrement.samplePricesRepeatedIncrement inc = 2;
    }
  }

  message priceHistoryRepeatedOrigin {
    repeated romsg.BlackMarketPriceHistory value = 1;
  }

  message priceHistoryRepeatedIncrement {
    repeated romsg.BlackMarketPriceHistoryIncrement value = 1;
  }

  message priceHistoryFieldIncrement {
    oneof value {
      romsg.BlackMarketGlobalDataIncrement.priceHistoryRepeatedOrigin all = 1;
      romsg.BlackMarketGlobalDataIncrement.priceHistoryRepeatedIncrement inc = 2;
    }
  }

  message sampleCountsRepeatedOrigin {
    repeated int64 value = 1;
  }

  message sampleCountsRepeatedIncrement {
    repeated int64 value = 1;
  }

  message sampleCountsFieldIncrement {
    oneof value {
      romsg.BlackMarketGlobalDataIncrement.sampleCountsRepeatedOrigin all = 1;
      romsg.BlackMarketGlobalDataIncrement.sampleCountsRepeatedIncrement inc = 2;
    }
  }

  optional int64 rollingAvgPrice = 10;
  optional int64 recentAvgPrice = 20;
  romsg.BlackMarketGlobalDataIncrement.samplePricesFieldIncrement samplePrices = 30;
  romsg.BlackMarketGlobalDataIncrement.priceHistoryFieldIncrement priceHistory = 40;
  romsg.BlackMarketGlobalDataIncrement.sampleCountsFieldIncrement sampleCounts = 50;
}

message BlackMarketGuildDataIncrement {
  message stacksRepeatedOrigin {
    repeated romsg.BlackMarketStack value = 1;
  }

  message stacksRepeatedIncrement {
    repeated romsg.BlackMarketStackIncrement value = 1;
  }

  message stacksFieldIncrement {
    oneof value {
      romsg.BlackMarketGuildDataIncrement.stacksRepeatedOrigin all = 1;
      romsg.BlackMarketGuildDataIncrement.stacksRepeatedIncrement inc = 2;
    }
  }

  message sellRecordsRepeatedOrigin {
    repeated romsg.BlackMarketTradeRecord value = 1;
  }

  message sellRecordsRepeatedIncrement {
    repeated romsg.BlackMarketTradeRecordIncrement value = 1;
  }

  message sellRecordsFieldIncrement {
    oneof value {
      romsg.BlackMarketGuildDataIncrement.sellRecordsRepeatedOrigin all = 1;
      romsg.BlackMarketGuildDataIncrement.sellRecordsRepeatedIncrement inc = 2;
    }
  }

  message buyRecordsRepeatedOrigin {
    repeated romsg.BlackMarketTradeRecord value = 1;
  }

  message buyRecordsRepeatedIncrement {
    repeated romsg.BlackMarketTradeRecordIncrement value = 1;
  }

  message buyRecordsFieldIncrement {
    oneof value {
      romsg.BlackMarketGuildDataIncrement.buyRecordsRepeatedOrigin all = 1;
      romsg.BlackMarketGuildDataIncrement.buyRecordsRepeatedIncrement inc = 2;
    }
  }

  romsg.BlackMarketGuildDataIncrement.stacksFieldIncrement stacks = 10;
  romsg.BlackMarketGuildDataIncrement.sellRecordsFieldIncrement sellRecords = 20;
  romsg.BlackMarketGuildDataIncrement.buyRecordsFieldIncrement buyRecords = 30;
}

message BlackMarketPriceHistoryIncrement {
  optional int64 avgPrice = 10;
  optional int32 dateHour = 20;
}

message BlackMarketStackIncrement {
  optional string stallUniqueId = 10;
  optional int64 unitPrice = 30;
  optional int64 totalCount = 40;
  optional int64 remainCount = 50;
  optional int64 displayAvailableTimeMs = 60;
  optional int64 expireTimeMs = 70;
}

message BlackMarketTradeRecordIncrement {
  optional string orderId = 10;
  optional int32 recordType = 20;
  optional int64 unitPrice = 30;
  optional int64 count = 40;
  optional int64 fee = 50;
  optional int64 counterpartGuildId = 60;
  optional int64 tradeTimeMs = 70;
  optional bool isRead = 80;
}

