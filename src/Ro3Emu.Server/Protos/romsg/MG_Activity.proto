syntax = "proto3";
package romsg;
import "MG_Common.proto";
import "FieldOption.proto";
import "MG_TerritoryWars.proto";
import "MG_Siege.proto";
import "MG_GuildLeague.proto";
import "MG_FlyingDragon.proto";
option optimize_for = LITE_RUNTIME;
option go_package = "./romsg";
option cc_generic_services = false;

enum ActivityStatus {
  ActivityStatus_None = 0;
  ActivityStatus_NotOpen = 1;
  ActivityStatus_Open = 2;
  ActivityStatus_Start = 3;
  ActivityStatus_End = 4;
  ActivityStatus_Close = 5;
}

enum EDailyActivityState {
  EAS_Invalid = 0;
  EAS_NotStart = 1;
  EAS_Running = 2;
}

enum ENewActivityState {
  ENewActivityState_WaitStart = 0;
  ENewActivityState_Start = 1;
  ENewActivityState_End = 2;
}

message NoviceActivity {
  map<int32, int32> taskIds = 1 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
}

message NoviceActivityReq {
  int32 taskId = 1;
}

message NoviceActivityResp {
  int32 result = 1;
  int32 taskId = 2;
}

message ActivityParam {
  oneof val {
    romsg.NoviceActivity noviceActivity = 1 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  }
}

message ActivityBaseInfo {
  int32 activityId = 1 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  romsg.ActivityParam activityParam = 2 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
}

message ActivityReqParam {
  oneof val {
    romsg.NoviceActivityReq noviceReq = 1;
  }
}

message ActivityReq {
  int32 activityId = 1;
  romsg.ActivityReqParam reqParam = 2;
}

message ActivityRespParam {
  oneof val {
    romsg.NoviceActivityResp noviceResp = 1;
  }
}

message ActivityResp {
  int32 result = 1;
  int32 activityId = 2;
  romsg.ActivityRespParam respParam = 3;
}

message DBActivityParam {
  oneof val {
    romsg.NoviceActivity noviceActivity = 1 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
    romsg.SiegeEntityTotalInfo siegeData = 2 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
    romsg.DBTerritoryWarsData territoryWarsData = 3 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
    romsg.GuildLeagueTotalInfo guildLeagueTotalInfo = 4 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
    romsg.DBFlyingDragonProduceInfo flyingDragonProduceInfo = 5 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
    romsg.DBSeasonEveInfo seasonEveInfo = 6 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
    romsg.DBJourneyActivity journey = 7 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
    romsg.DBPronteraDefenseInfo pronteraDefense = 8 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
    romsg.DBTerritoryWarData territoryWarData = 9 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
    romsg.DBRainbowKoiActivityData rainbowKoiData = 10 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
    romsg.DBGveHuntingActivityData gveHuntingData = 11 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
    romsg.DBCasualBattleActivityData casualBattleData = 12 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
    romsg.DBOnePieceActivity OnePieceInfo = 13 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  }
}

message RainbowKoiCandidateInfo {
  bool isEliminated = 1 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
