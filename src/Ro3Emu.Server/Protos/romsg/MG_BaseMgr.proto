syntax = "proto3";
package romsg;
import "MG_Define.proto";
option optimize_for = LITE_RUNTIME;
option go_package = "./romsg";
option cc_generic_services = false;

message BaseMgrMsg {
  romsg.MSG_Type msgType = 1;
  bytes data = 2;
}

message BaseMgrPlayerLoginReq {
  int64 playerID = 1;
}

message BaseRegisterReq {
  int32 baseID = 1;
  string baseName = 2;
}

message BaseRegisterRsp {
  int32 code = 1;
}

