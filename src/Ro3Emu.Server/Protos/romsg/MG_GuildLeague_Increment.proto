message GuildLeagueGuildInfoIncrement {
  message iconFieldIncrement {
    oneof value {
      romsg.GuildHeadIcon all = 1;
      romsg.GuildHeadIconIncrement inc = 2;
    }
  }

  message honorFieldIncrement {
    oneof value {
      romsg.GuildHistoryHonor all = 1;
      romsg.GuildHistoryHonorIncrement inc = 2;
    }
  }

  optional int64 guildID = 10;
  optional int64 power = 20;
  optional string name = 30;
  romsg.GuildLeagueGuildInfoIncrement.iconFieldIncrement icon = 40;
  optional int32 memberCount = 50;
  optional int32 guildWeekActivity = 60;
  optional int32 WarnNum = 70;
  optional bool del = 80;
  optional int32 areaId = 90;
  romsg.GuildLeagueGuildInfoIncrement.honorFieldIncrement honor = 100;
}

message GuildLeagueGuildMatchInfoIncrement {
  optional int64 guildID = 10;
  optional int64 power = 20;
  optional int32 rank = 30;
  optional int32 rankOrder = 40;
  optional int32 matcharea = 50;
  optional int32 score = 60;
  optional romsg.GuildLeagueRankLift rankLift = 70;
}

message GuildLeagueMatchGroupInfoIncrement {
  message guildDataRepeatedOrigin {
    repeated romsg.GuildLeagueGuildMatchInfo value = 1;
  }

  message guildDataRepeatedIncrement {
    repeated romsg.GuildLeagueGuildMatchInfoIncrement value = 1;
  }

  message guildDataFieldIncrement {
    oneof value {
      romsg.GuildLeagueMatchGroupInfoIncrement.guildDataRepeatedOrigin all = 1;
      romsg.GuildLeagueMatchGroupInfoIncrement.guildDataRepeatedIncrement inc = 2;
    }
  }

  message matchpairRepeatedOrigin {
    repeated romsg.GuildLeagueMatchPair value = 1;
  }

  message matchpairRepeatedIncrement {
    repeated romsg.GuildLeagueMatchPairIncrement value = 1;
  }

  message matchpairFieldIncrement {
    oneof value {
      romsg.GuildLeagueMatchGroupInfoIncrement.matchpairRepeatedOrigin all = 1;
      romsg.GuildLeagueMatchGroupInfoIncrement.matchpairRepeatedIncrement inc = 2;
    }
  }

  message resultInfoRepeatedOrigin {
    repeated romsg.LeagueResultInfo value = 1;
  }

  message resultInfoRepeatedIncrement {
    repeated romsg.LeagueResultInfoIncrement value = 1;
  }

  message resultInfoFieldIncrement {
    oneof value {
      romsg.GuildLeagueMatchGroupInfoIncrement.resultInfoRepeatedOrigin all = 1;
      romsg.GuildLeagueMatchGroupInfoIncrement.resultInfoRepeatedIncrement inc = 2;
    }
  }

  message preliMatchpairRepeatedOrigin {
    repeated romsg.GuildLeagueMatchPair value = 1;
  }

  message preliMatchpairRepeatedIncrement {
    repeated romsg.GuildLeagueMatchPairIncrement value = 1;
  }

  message preliMatchpairFieldIncrement {
    oneof value {
      romsg.GuildLeagueMatchGroupInfoIncrement.preliMatchpairRepeatedOrigin all = 1;
      romsg.GuildLeagueMatchGroupInfoIncrement.preliMatchpairRepeatedIncrement inc = 2;
    }
  }

  optional int64 rank = 10;
  optional int64 rankorder = 20;
  romsg.GuildLeagueMatchGroupInfoIncrement.guildDataFieldIncrement guildData = 30;
  romsg.GuildLeagueMatchGroupInfoIncrement.matchpairFieldIncrement matchpair = 40;
  romsg.GuildLeagueMatchGroupInfoIncrement.resultInfoFieldIncrement resultInfo = 50;
  romsg.GuildLeagueMatchGroupInfoIncrement.preliMatchpairFieldIncrement preliMatchpair = 60;
}

message GuildLeagueMatchPairIncrement {
  optional int64 blueGuildId = 10;
  optional int64 redGuildId = 20;
}

message GuildLeagueTotalInfoIncrement {
  message activityInfoFieldIncrement {
    oneof value {
      romsg.LeagueActivityInfo all = 1;
      romsg.LeagueActivityInfoIncrement inc = 2;
    }
  }

  message matchInfoRepeatedOrigin {
    repeated romsg.GuildLeagueMatchGroupInfo value = 1;
  }

  message matchInfoRepeatedIncrement {
    repeated romsg.GuildLeagueMatchGroupInfoIncrement value = 1;
  }

  message matchInfoFieldIncrement {
    oneof value {
      romsg.GuildLeagueTotalInfoIncrement.matchInfoRepeatedOrigin all = 1;
      romsg.GuildLeagueTotalInfoIncrement.matchInfoRepeatedIncrement inc = 2;
    }
  }

  message guildInfoRepeatedOrigin {
    repeated romsg.GuildLeagueGuildInfo value = 1;
  }

  message guildInfoRepeatedIncrement {
    repeated romsg.GuildLeagueGuildInfoIncrement value = 1;
  }

  message guildInfoFieldIncrement {
    oneof value {
      romsg.GuildLeagueTotalInfoIncrement.guildInfoRepeatedOrigin all = 1;
      romsg.GuildLeagueTotalInfoIncrement.guildInfoRepeatedIncrement inc = 2;
    }
  }

  message guildSceneMapFieldIncrement {
    oneof value {
      romsg.GuildSceneDungeonMap all = 1;
      romsg.GuildSceneDungeonMapIncrement inc = 2;
      bool del = 3;
    }
  }

  romsg.GuildLeagueTotalInfoIncrement.activityInfoFieldIncrement activityInfo = 10;
  romsg.GuildLeagueTotalInfoIncrement.matchInfoFieldIncrement matchInfo = 20;
  romsg.GuildLeagueTotalInfoIncrement.guildInfoFieldIncrement guildInfo = 30;
  map<int64, romsg.GuildLeagueTotalInfoIncrement.guildSceneMapFieldIncrement> guildSceneMap = 40;
}

message GuildSceneDungeonMapIncrement {
  message dungeonSceneMapFieldIncrement {
    oneof value {
      int64 all = 1;
      int64 inc = 2;
      bool del = 3;
    }
  }

  map<int64, romsg.GuildSceneDungeonMapIncrement.dungeonSceneMapFieldIncrement> dungeonSceneMap = 10;
}

message LeagueActivityInfoIncrement {
  optional bool open = 10;
  optional int64 startTime = 20;
  optional int64 endTime = 30;
  optional romsg.GuildLeagueStatus eStatus = 40;
  optional int64 initTime = 50;
  optional int64 preliminaryTime = 70;
  optional int64 semiFinalTime = 80;
  optional int64 finalTime = 90;
  optional string errMsg = 100;
  optional int32 index = 110;
  optional int64 nextPreliminaryTime = 120;
  optional int64 preliminaryEndTime = 130;
  optional int64 semiFinalEndTime = 140;
  optional int64 finalEndTime = 150;
}

