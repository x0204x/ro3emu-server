syntax = "proto3";
package romsg;
option optimize_for = LITE_RUNTIME;
option go_package = "./romsg";
option cc_generic_services = false;

message GetThreeDayLevelAwardReq {
  int64 levelAwardCfgId = 1;
}

message GetThreeDayLevelAwardRsp {
  int32 placeholder = 1;
}

message GetThreeDayFunctionPreviewAwardReq {
  int64 functionPreviewCfgId = 1;
}

message GetThreeDayFunctionPreviewAwardRsp {
  int32 placeholder = 1;
}

