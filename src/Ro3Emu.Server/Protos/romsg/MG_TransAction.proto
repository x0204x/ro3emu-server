syntax = "proto3";
package romsg;
import "MG_Common.proto";
import "FieldOption.proto";
option optimize_for = LITE_RUNTIME;
option go_package = "./romsg";
option cc_generic_services = false;

message ResourceOperate {
  repeated romsg.ItemBaseInfo item = 1 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  int64 tarPlayerId = 2 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
}

message ActionOneStep {
  string actionName = 1 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  repeated romsg.ResourceOperate resourceOperate = 2 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  string checkParam = 3 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
}

message SaleTransAction {
  option (romsg.dbsync) = "action_tm_sale__|string";
  int64 ro3Define_SaveVersion = 9999 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  int64 ro3Define_DbTerm = 10000 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  romsg.TransAction transaction = 1 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
}

message BuyTransAction {
  option (romsg.dbsync) = "action_tm_buy__|string";
  int64 ro3Define_SaveVersion = 9999 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  int64 ro3Define_DbTerm = 10000 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  romsg.TransAction transaction = 1 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
}

message TransAction {
  string transActionId = 1 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  string name = 2 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  repeated romsg.ActionOneStep steps = 3 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  int64 ownerRoleID = 4 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
}

