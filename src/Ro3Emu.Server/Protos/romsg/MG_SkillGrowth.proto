syntax = "proto3";
package romsg;
import "FieldOption.proto";
import "MG_Common.proto";
option optimize_for = LITE_RUNTIME;
option go_package = "./romsg";
option cc_generic_services = false;

enum SkillWheelSlotType {
  SkillWheelNone = 0;
  SkillWheelNormal1 = 1;
  SkillWheelNormal2 = 2;
  SkillWheelNormal3 = 3;
  SkillWheelNormal4 = 4;
  SkillWheelNormal5 = 5;
  SkillWheelNormal6 = 6;
  SkillWheelSkillQueue = 7;
  SkillWheelMount1 = 8;
  SkillWheelMount2 = 9;
  SkillWheelExtraSkill1 = 10;
  SkillWheelPet = 11;
  SkillGamePlay1 = 12;
  SkillGamePlay2 = 13;
  SkillGamePlay3 = 14;
}

enum ESkillDisableReason {
  ESkillDisableReason_Normal = 0;
  ESkillDisableReason_TenDungeonReviveCountNotEnough = 20;
}

enum SkillLoadOperation {
  SKILL_LOAD_OP_NONE = 0;
  SKILL_LOAD_OP_LOAD = 1;
  SKILL_LOAD_OP_UNLOAD = 2;
  SKILL_LOAD_OP_REPLACE = 3;
}

message SkillData {
  int32 skillId = 1 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  int32 skillLevel = 2 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
}

message SkillPlan {
  bool isUnlock = 1 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  map<int32, romsg.SkillData> skillAssigns = 2 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  repeated romsg.SkillData manualLoadSkill = 3 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  repeated romsg.SkillData autoLoadSkill = 4 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  map<int32, romsg.SkillData> skillQueue = 5 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  string name = 6 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  romsg.PowerUnit power = 7 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  int32 skillGenre = 8 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  map<int32, int32> skillPoints = 9 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
}

message SkillWheelSlot {
  int32 skillConfigId = 1 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  bool enable = 2 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  bool isHighlight = 3 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  bool isInteraction = 4 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  romsg.ESkillDisableReason disableReason = 5 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  int64 highlightEndTimeMs = 6 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  int32 mode = 7 [(romsg.save) = 0, (romsg.self) = 1, (romsg.other) = 0];
}

message SkillWheel {
  map<int32, romsg.SkillWheelSlot> whellSkills = 1 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  int32 atkSkillId = 2 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  romsg.SkillWheelSlot skillQueue = 3 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  romsg.SkillWheelSlot petSkill = 4 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  map<int32, romsg.SkillWheelSlot> dungeonSkills = 5 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
}

message DBSkillData {
  option (romsg.clientsync) = "watchable|synallmark|synversion";
  int64 ro3Define_SyncVersion = 9998 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  int32 maxPlanCount = 1 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  int32 currentPlanIndex = 2 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  repeated int32 skillList = 3 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  repeated romsg.SkillPlan skillAssignPlans = 4 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  int32 currentAtkSkillId = 5 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  romsg.SkillWheel skillWheel = 6 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  bytes skillCdData = 7 [(romsg.save) = 1, (romsg.self) = 0, (romsg.other) = 0];
  romsg.SkillWheel originSkillWheel = 8 [(romsg.save) = 0, (romsg.self) = 1, (romsg.other) = 0];
}

message SkillSwitchGenreReq {
  int32 genre = 1;
}

message SkillSwitchGenreResp {
  int32 result = 1;
}

message SkillGrowthSkillPlanUpdateReq {
  int32 plan = 1;
  map<int32, romsg.SkillData> levelUpList = 2;
}

message SkillGrowthSkillPlanUpdateResp {
  int32 result = 1;
}

message SwitchPlanReq {
  int32 plan = 1;
}

message SwitchPlanResp {
  int32 result = 1;
  int32 plan = 2;
  int32 flag = 3;
}

message SkillLoadReq {
  romsg.SkillLoadOperation opType = 1;
  bool isManual = 2;
  int32 socketNum = 3;
  romsg.SkillData info = 4;
  romsg.SkillData replaceInfo = 5;
}

message SkillLoadResp {
  int32 result = 1;
  bool isManual = 2;
}

message SkillResetReq {
  int32 plan = 1;
}

message SkillResetResp {
  int32 result = 1;
  int32 plan = 2;
}

message SkillPlanChangeNameReq {
  int32 plan = 1;
  string name = 2;
}

message SkillPlanChangeNameResp {
  int32 result = 1;
  int32 plan = 2;
  string name = 3;
}

message SkillQueueUpdateReq {
  int32 plan = 1;
  romsg.SkillLoadOperation opType = 2;
  int32 queueIndex = 3;
  romsg.SkillData info = 4;
}

message SkillQueueUpdateResp {
  int32 result = 1;
  int32 plan = 2;
}

