syntax = "proto3";
package romsg;
import "MG_Define.proto";
option optimize_for = LITE_RUNTIME;
option go_package = "./romsg";
option cc_generic_services = false;

message GatewayMsg {
  romsg.MSG_Type msgType = 1;
  bytes data = 2;
}

message UserOfflineNotify {
  romsg.EKickOffType reason = 1;
}

