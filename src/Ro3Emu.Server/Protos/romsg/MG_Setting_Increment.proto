option cc_generic_services = false;

message DBSettingInfoIncrement {
  message guildSettingInfoFieldIncrement {
    oneof value {
      romsg.SettingGuild all = 1;
      romsg.SettingGuildIncrement inc = 2;
    }
  }

  message showDetailInfoFieldIncrement {
    oneof value {
      romsg.SettingShowDetailInfo all = 1;
      romsg.SettingShowDetailInfoIncrement inc = 2;
    }
  }

  message wildAFKInfoFieldIncrement {
    oneof value {
      romsg.SettingWildAFKInfo all = 1;
      romsg.SettingWildAFKInfoIncrement inc = 2;
    }
  }

  message clientSettingFieldIncrement {
    oneof value {
      bytes all = 1;
      bytes inc = 2;
      bool del = 3;
    }
  }

  message commonSettingFieldIncrement {
    oneof value {
      int64 all = 1;
      int64 inc = 2;
      bool del = 3;
    }
  }

  int64 version = 1;
  bool syncAllMark = 2;
  romsg.DBSettingInfoIncrement.guildSettingInfoFieldIncrement guildSettingInfo = 30;
  romsg.DBSettingInfoIncrement.showDetailInfoFieldIncrement showDetailInfo = 40;
  romsg.DBSettingInfoIncrement.wildAFKInfoFieldIncrement wildAFKInfo = 50;
  map<int32, romsg.DBSettingInfoIncrement.clientSettingFieldIncrement> clientSetting = 60;
  map<int32, romsg.DBSettingInfoIncrement.commonSettingFieldIncrement> commonSetting = 70;
}

message SettingGuildIncrement {
  optional bool disableShowMyNews = 10;
}

message SettingShowDetailInfoIncrement {
  optional romsg.ShowDetailInfoType showDetailInfo = 10;
  optional bool init = 20;
}

message SettingWildAFKInfoIncrement {
  optional bool disAbleConsumeAFKTime = 10;
  optional bool autoBack = 20;
  optional bool timeBack = 30;
  optional bool autoCancel = 40;
}

