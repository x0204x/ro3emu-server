option optimize_for = LITE_RUNTIME;
option cc_generic_services = false;

message DBSeasonStageInfoIncrement {
  message bornAreasRepeatedOrigin {
    repeated int64 value = 1;
  }

  message bornAreasRepeatedIncrement {
    repeated int64 value = 1;
  }

  message bornAreasFieldIncrement {
    oneof value {
      romsg.DBSeasonStageInfoIncrement.bornAreasRepeatedOrigin all = 1;
      romsg.DBSeasonStageInfoIncrement.bornAreasRepeatedIncrement inc = 2;
    }
  }

  optional int64 stageId = 10;
  optional int64 seasonArea = 20;
  optional int64 playbook = 30;
  romsg.DBSeasonStageInfoIncrement.bornAreasFieldIncrement bornAreas = 40;
  optional bool canMatch = 50;
  optional bool finished = 60;
}

message SeasonAreaMatchResultIncrement {
  message matchResultsFieldIncrement {
    oneof value {
      romsg.SeasonAreaMatchResultItem all = 1;
      romsg.SeasonAreaMatchResultItemIncrement inc = 2;
      bool del = 3;
    }
  }

  map<string, romsg.SeasonAreaMatchResultIncrement.matchResultsFieldIncrement> matchResults = 10;
}

message SeasonAreaMatchResultItemIncrement {
  message bornAreasRepeatedOrigin {
    repeated int64 value = 1;
  }

  message bornAreasRepeatedIncrement {
    repeated int64 value = 1;
  }

  message bornAreasFieldIncrement {
    oneof value {
      romsg.SeasonAreaMatchResultItemIncrement.bornAreasRepeatedOrigin all = 1;
      romsg.SeasonAreaMatchResultItemIncrement.bornAreasRepeatedIncrement inc = 2;
    }
  }

  optional int64 seasonAreaId = 10;
  optional int64 season = 20;
  optional int64 playbook = 30;
  romsg.SeasonAreaMatchResultItemIncrement.bornAreasFieldIncrement bornAreas = 40;
}

message SeasonAreaMatchVersionResultIncrement {
  message versionResultFieldIncrement {
    oneof value {
      romsg.SeasonAreaMatchResult all = 1;
      romsg.SeasonAreaMatchResultIncrement inc = 2;
      bool del = 3;
    }
  }

  message counterFieldIncrement {
    oneof value {
      int32 all = 1;
      int32 inc = 2;
      bool del = 3;
    }
  }

  map<string, romsg.SeasonAreaMatchVersionResultIncrement.versionResultFieldIncrement> versionResult = 10;
  map<int32, romsg.SeasonAreaMatchVersionResultIncrement.counterFieldIncrement> counter = 20;
}

message SeasonStateIncrement {
  optional int64 seasonId = 10;
  optional int64 playBookId = 20;
  optional int64 stageId = 30;
}

