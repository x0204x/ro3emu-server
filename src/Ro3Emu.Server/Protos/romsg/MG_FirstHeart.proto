syntax = "proto3";
package romsg;
option optimize_for = LITE_RUNTIME;
option go_package = "./romsg";
option cc_generic_services = false;

message FirstHeartGetTaskRewardReq {
  int32 type = 1;
  int32 taskId = 2;
}

message FirstHeartGetTaskRewardResp {
  int32 result = 1;
}

message FirstHeartGetScoreRewardReq {
  int32 type = 1;
  int32 rewardId = 2;
}

message FirstHeartGetScoreRewardResp {
  int32 result = 1;
}

