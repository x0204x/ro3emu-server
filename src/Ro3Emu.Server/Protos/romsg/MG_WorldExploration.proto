syntax = "proto3";
package romsg;
option optimize_for = LITE_RUNTIME;
option go_package = "./romsg";
option cc_generic_services = false;

message WorldExplorationFillPhaseNodeReq {
  int64 PhaseCfgId = 1;
  int64 NodeCfgId = 2;
  int64 ItemId = 3;
  int32 position = 4;
}

message WorldExplorationFillPhaseNodeRes {
  int32 Err = 1;
}

