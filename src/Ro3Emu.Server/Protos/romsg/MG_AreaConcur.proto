syntax = "proto3";
package romsg;
import "FieldOption.proto";
option optimize_for = LITE_RUNTIME;
option go_package = "./romsg";
option cc_generic_services = false;

message AreaConcurGainMapAwardReq {
  int64 mapId = 1;
}

message AreaConcurGainMapAwardResp {
  romsg.AreaConcurGainMapAwardReq req = 1;
}

message AreaConcurGainAreaAwardReq {
  int64 areaId = 1;
  map<int64, bool> stageIds = 2 [(romsg.max_count) = 50];
}

message AreaConcurGainAreaAwardResp {
  romsg.AreaConcurGainAreaAwardReq req = 1;
}

message AreaConcurGainMonsterAwardReq {
  int64 monsterId = 1;
  map<int64, bool> stageIds = 2 [(romsg.max_count) = 50];
}

message AreaConcurGainMonsterAwardResp {
  romsg.AreaConcurGainMonsterAwardReq req = 1;
}

