syntax = "proto3";
package romsg;
option optimize_for = LITE_RUNTIME;
option go_package = "./romsg";
option cc_generic_services = false;

message TokenVerifyReq {
  string account = 1;
  int64 id = 2;
  int32 gsID = 3;
}

message TokenVerifyResp {
  int32 result = 1;
}

message PickPlayerReq {
  string token = 1;
}

message PickPlayerResp {
  int32 result = 1;
}

