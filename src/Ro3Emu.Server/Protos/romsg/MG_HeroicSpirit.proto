syntax = "proto3";
package romsg;
option optimize_for = LITE_RUNTIME;
option go_package = "./romsg";
option cc_generic_services = false;

message HeroicSpiritChallengeReq {
  int64 challengeId = 1;
}

message HeroicSpiritChallengeRes {
  int64 Err = 1;
}

message HeroicSpiritPrayReq {
  int64 count = 1;
}

message HeroicSpiritPrayRes {
  int64 Err = 1;
}

message HeroicSpiritDungeonInitData {
  int64 challengeId = 1;
}

