syntax = "proto3";
package romsg;
option optimize_for = LITE_RUNTIME;
option go_package = "./romsg";
option cc_generic_services = false;

message ParagonLevelAllocatePointReq {
  int32 slot = 1;
  int32 points = 2;
}

message ParagonLevelAllocatePointResp {
  int32 result = 1;
}

message ParagonLevelRuneInstallReq {
  int32 slot = 1;
  int64 runeGuid = 2;
}

message ParagonLevelRuneInstallResp {
  int32 result = 1;
}

message ParagonLevelRuneRemoveReq {
  int32 slotId = 1;
}

message ParagonLevelRuneRemoveResp {
  int32 result = 1;
}

message ParagonLevelResetAllReq {
}

message ParagonLevelResetAllResp {
  int32 result = 1;
}

message ParagonLevelResetSingleReq {
  int32 slotId = 1;
}

message ParagonLevelResetSingleResp {
  int32 result = 1;
}

