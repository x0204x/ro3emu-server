message SceneLoadedReq {
  int64 sceneId = 1;
  uint64 viewMaxCount = 2;
  uint64 nameBoardMaxCount = 3;
  uint64 lodHighCount = 4;
}

message SceneLoadedResp {
  int64 sceneId = 1;
  uint64 viewMaxCount = 2;
  uint64 nameBoardMaxCount = 3;
  uint64 lodHighCount = 4;
  int32 result = 5;
}

message ChangeViewCfgReq {
  uint64 viewMaxCount = 1;
  uint64 nameBoardMaxCount = 2;
  uint64 lodHighCount = 3;
}

message ChangeViewCfgResp {
  int32 result = 1;
  uint64 viewMaxCount = 2;
  uint64 nameBoardMaxCount = 3;
  uint64 lodHighCount = 4;
}

message ChangeFaceReq {
  float angle = 1;
}

message WalkReq {
  romsg.Vec3 pos = 1;
  float dir = 2;
  bool bStop = 3;
  float face = 4;
  float speedRate = 5;
}

message FlySwitchReq {
  bool isFly = 1;
  float height = 2;
}

message FlyMoveReq {
  romsg.Vec3 pos = 1;
  romsg.Vec3 dir = 2;
  bool bStop = 3;
  float face = 4;
}

message FreeFallJumpReq {
  romsg.Vec3 toPos = 1;
  float face = 2;
}

message FixLandNtf {
  int64 uuid = 1;
  int32 fixLandTime = 2;
}

message SyncVehicleReq {
  float face = 1;
}

message AoiTurningInfo {
  float start_face = 1;
  float end_face = 2;
  uint64 duration_ms = 3;
  bool is_stop = 4;
  float speed = 5;
  uint64 start_time = 6;
}

message AoIBuffInfo {
  repeated romsg.BuffInfo add_buffs = 1;
  repeated int64 remove_buffs = 2;
}

message MovementWalk {
  float dir = 1;
  float speed = 2;
  float acc = 3;
  float endHeight = 4;
}

message MovementMove {
  romsg.Vec3 startVelocity = 1;
  romsg.Vec3 accVelocity = 2;
}

message MovementAroundPoint {
  romsg.Vec3 aroundPoint = 1;
  float radius = 2;
  float angleSpeed = 3;
  float angle = 4;
}

message MovementAroundObject {
  int64 aroundObject = 1;
  float radius = 2;
  float angleSpeed = 3;
  float angle = 4;
}

message MovementTrace {
  int64 traceTarget = 1;
  romsg.Vec3 velocity = 2;
  float angleSpeed = 3;
}

message MovementArchimedeanSpiral {
  romsg.Vec3 center = 1;
  float initialRadius = 2;
  float initialAngle = 3;
  float radiusGrowthSpeed = 4;
  float angleSpeed = 5;
  float speed = 6;
}

message MovementEquiangularSpiral {
  romsg.Vec3 center = 1;
  float initialRadius = 2;
  float initialAngle = 3;
  float radiusMultiplierPerRound = 4;
  float angleSpeed = 5;
  float speed = 6;
}

message MovementInfo {
  romsg.Vec3 pos = 1;
  int64 serverTime = 2;
  int32 moveDuration = 3;
  float face = 4;
  bool faceMove = 5;
  romsg.MovementType moveType = 6;
  romsg.MovementWalk movementWalk = 7;
  romsg.MovementMove movementMove = 8;
  romsg.MovementAroundPoint movementAroundPoint = 9;
  romsg.MovementAroundObject movementAroundObject = 10;
  romsg.MovementTrace movementTrace = 11;
  romsg.MovementArchimedeanSpiral movementArchimedeanSpiral = 12;
  romsg.MovementEquiangularSpiral movementEquiangularSpiral = 13;
}

message MovementChangeNtf {
  int64 uid = 1;
  romsg.MovementTransitionType transType = 2;
  romsg.MovementInfo movementInfo = 3;
}

message MovementConfigSyncNtf {
  map<string, int64> params = 1;
}

message ContinueTurningInfo {
  float face = 1;
  int64 serverTime = 2;
  float angleSpeed = 3;
  int32 turnDuration = 4;
  int64 faceTarget = 5;
}

message ContinueTurningChangeNtf {
  int64 uid = 1;
  romsg.ContinueTurningInfo turningInfo = 2;
}

message LocalPlayerFaceChangeNtf {
  float face = 1;
}

message ClientTeleportObject {
  int64 targetUid = 1;
  romsg.Vec3 targetPos = 2;
  float face = 3;
}

message AoIWidgetInfo {
  repeated romsg.WidgetInfo add_widgets = 1;
  repeated int64 remove_widgets = 2;
}

message AoIChangeGate {
  bool gateState = 1;
}

message AoICarry {
  uint64 id = 1;
  int32 carry_slot = 2;
  romsg.Vec3 carry_offset = 3;
  int32 carry_type = 4;
}

message AoICarryInfo {
  romsg.AoICarry be_carried = 1;
  repeated romsg.AoICarry all_carries = 2;
  repeated romsg.AoICarry add_carries = 3;
  repeated romsg.AoICarry remove_carries = 4;
}

message AoIVehicleFireDirection {
  int32 slot = 1;
  float fire_dir = 2;
}

message AoIVehicleDetail {
  repeated romsg.AoIVehicleFireDirection fire_dirs = 1;
}

message EntityEnforceInfo {
  int32 enforceType = 1;
  float enforceSpeed = 2;
  float enforceDir = 3;
  int32 shapeType = 4;
  repeated float size = 5;
}

message BeEnforcedBy {
  repeated int64 be_enforced_uids = 1;
}

message DynamicCollisionInfo {
  int32 collisionType = 1;
  repeated float collisionSize = 2;
  bool isEnable = 3;
  int32 blockLevel = 4;
}

message AoIInfoSingle {
  uint64 entity_uuid = 1;
  romsg.AoIWidgetInfo widget_data = 7;
  romsg.AoICarryInfo carry_info = 8;
  romsg.AoIVehicleDetail vehicle_detail = 9;
}

message EntityBeEnforcedChange {
  int64 uuid = 1;
  repeated int64 be_enforced_uids = 2;
}

message EntityEnforceChange {
  int64 uuid = 1;
  romsg.EntityEnforceInfo enforce_info = 2;
}

message AoICommonInfo {
  enum AoiCommonType {
    None = 0;
    StateInfo = 1;
    ForbidInfo = 2;
    TurningInfo = 3;
    BehaviorStateMachine = 4;
    IdleInfo = 5;
    StaggerInfo = 6;
  }

  uint64 bigType = 1;
  uint64 smallType = 2;
  romsg.AoiObjStateInfo stateInfo = 3;
  romsg.AoiObjForbidInfo forbidInfo = 4;
  romsg.AoiBehaviorStateMachineInfo behaviorStateMachineInfo = 6;
  romsg.AoiIdleInfo idleInfo = 7;
  romsg.AoiObjStaggerInfo staggerInfo = 8;
}

message AoiIdleInfo {
  int32 emojiId = 1;
}

message AoiBehaviorStateMachineInfo {
  romsg.ObjectState curState = 1;
  romsg.ObjectState lastState = 2;
  romsg.StateParam param = 3;
  int64 startStateTime = 4;
  romsg.StateParam lastParam = 5;
}

message AoiObjStateInfo {
  romsg.CommonBigMask data = 1;
}

message AoiObjForbidInfo {
  romsg.CommonBigMask data = 1;
}

message AoiObjStaggerInfo {
  uint64 stagger_mask = 1;
}

message AoIInfoTotal {
  repeated romsg.AoIInfoSingle aoi_data = 1;
  uint64 AoITickMs = 2;
  romsg.GateBroadCast gateInfo = 3;
  uint64 TickNowMs = 4;
  map<uint64, int32> entity_types = 5;
}

message SelfInfoEndFrameNotify {
  romsg.AoiObjStateInfo state = 1;
  romsg.AoiObjForbidInfo forbid = 2;
  romsg.AoiObjStaggerInfo stagger = 3;
}

message MiniMapInfoEscortCart {
  int64 ownerId = 1;
  int64 guildId = 2;
  int32 cartType = 3;
  int32 damageLevel = 4;
}

message MiniMapInfo {
  uint64 uid = 1;
  romsg.Vec3 pos = 2;
  uint64 camp = 3;
  uint64 npcConfigId = 4;
  uint64 hp = 5;
  romsg.MiniMapInfoSpecialType specialType = 6;
  romsg.MiniMapInfoEscortCart escortCartInfo = 7;
  romsg.MiniMapInfoData miniMapInfoData = 8;
}

message MiniMapInfoData {
  oneof var {
    romsg.MiniMapInfoDataCustomData customData = 1;
  }
}

message MiniMapInfoDataCustomData {
  repeated romsg.CustomData syncCustomDatas = 1;
}

message MiniMapMsg {
  repeated romsg.MiniMapInfo miniInfo = 1;
}

message EscortDetectMiniMapNtf {
  repeated romsg.MiniMapInfo escortInfo = 1;
}

message MiniMapStatus {
  bool IsOpen = 1;
}

message AoIPos {
  uint64 entity_uuid = 1;
  romsg.Vec3 position = 2;
  float face = 3;
}

message AoIPosTest {
  repeated romsg.AoIPos pos = 1;
  bool state = 2;
}

message SceneTeleportReason {
  romsg.SceneTeleportReasonType eType = 1;
  repeated int64 param = 2;
}

message SceneTeleportReq {
  romsg.SceneTeleportReason teleportReason = 1;
  int64 targetMapId = 2;
  romsg.Vec3 currentPos = 3;
}

message SceneTeleportRsp {
  int32 result = 1;
}

message TaskTrackTeleportReq {
  int64 taskId = 1;
}

message TaskTempTeleportReq {
  int64 targetMapId = 1;
  int64 pointId = 2;
  int64 taskId = 3;
}

message SceneQueuingReq {
  int64 sceneId = 1;
}

message SceneQueuingRes {
  int64 sceneId = 1;
  int64 sceneEntryId = 2;
  int32 lineOrder = 3;
  int32 estimateSeconds = 4;
}

message SceneQueuingCancel {
  int64 sceneId = 1;
}

message SceneBossShoutNotify {
  int64 monsterId = 1;
  int32 shoutId = 2;
}

message GetSceneLineInfoReq {
  uint64 playerUUID = 1;
  int64 sceneEntry = 2;
  uint64 area = 3;
}

message SceneLineInfo {
  int64 sceneID = 1;
  int32 linenum = 2;
  int32 currolenum = 3;
  int64 sceneEntry = 4;
}

message GetSceneLineInfoResp {
  int32 result = 1;
  uint64 playerUUID = 2;
  int64 sceneEntry = 3;
  repeated romsg.SceneLineInfo lineInfo = 4;
}

message SwitchSceneLineReq {
  uint64 playerUUID = 1;
  int64 sceneEntry = 2;
  uint64 area = 3;
  int32 linenum = 4;
  romsg.SwitchSceneSourceType eSource = 5;
}

message SwitchSceneLineResp {
  int32 result = 1;
  int64 sceneEntry = 2;
  int64 sceneID = 3;
  int32 linenum = 4;
  romsg.SwitchSceneReasonType reason = 5;
  romsg.SwitchSceneSourceType eSource = 6;
}

message CustomForceField {
  romsg.ForceFieldType field_type = 1;
  float forceDir = 2;
  romsg.Vec3 forceTargetPos = 3;
  float forceSpeed = 4;
  romsg.ShapeRange forceRangeInfo = 5;
}

message ForceFieldInfo {
  uint32 uuid = 1;
  bool remove = 2;
  uint32 forceConfId = 3;
  romsg.CustomForceField customField = 4;
}

message ForceFieldNotify {
  repeated romsg.ForceFieldInfo forceFields = 1;
}

message DungeonStateChangeNtf {
  romsg.DUNGEON_STATE nStateDungeon = 1;
  int64 nTmActive = 2;
  int64 nTmStart = 3;
  int64 nTmEnd = 4;
  int64 nTmCur = 5;
}

message TempLeaveNtf {
  int32 CountdownSeconds = 1;
}

message RecureTempLeaveReq {
}

message ForceLeaveNtf {
  int64 leaveFromSceneEntry = 1;
  int32 errorCode = 2;
}

message DebugShowHeightNtf {
  message PointHeight {
    float x = 1;
    float y = 2;
    float height = 3;
  }

  repeated romsg.DebugShowHeightNtf.PointHeight data = 1;
  bool clear = 2;
}

message DebugShow3DBox {
  message Rect3DBox {
    romsg.Vec3 vecCenter = 1;
    float fXLength = 2;
    float fYLength = 3;
    float fZLength = 4;
    float fAngle = 5;
  }

  repeated romsg.DebugShow3DBox.Rect3DBox datas = 1;
}

message DebugShowCylinder {
  message Cylinder {
    romsg.Vec3 vecCenter = 1;
    float fRadius = 2;
    float fHeight = 3;
  }

  repeated romsg.DebugShowCylinder.Cylinder datas = 1;
}

message DebugShowFan {
  message Fan {
    romsg.Vec3 vecCenter = 1;
    float fRadius = 2;
    float fAngle = 3;
    float fSweepAngle = 4;
    float fHeight = 5;
  }

  repeated romsg.DebugShowFan.Fan datas = 1;
}

message QueryCurrentNpcReq {
  repeated int32 pointIDs = 1;
  int64 npcConfigID = 2;
}

message QueryCurrentNpcResp {
  repeated int32 pointIDs = 1;
}

message SceneBaseInfoNotify {
  int64 sceneId = 1;
  map<int32, romsg.CommonPublicVar> vars = 2;
  map<int32, romsg.CommonPublicVar> playerVars = 3;
  romsg.PublicVarChangeType changeType = 100;
}

message SceneEventNotify {
  int64 sceneId = 1;
  repeated romsg.EventParams params = 2;
  map<int32, romsg.CommonPublicVar> vars = 3;
  string cliFuncname = 4;
}

message ScenePerformaceWatchReq {
  bool startWatch = 1;
}

