syntax = "proto3";
package romsg;
import "MG_Common.proto";
import "MG_Define.proto";
import "MG_DB.proto";
import "MG_Skill.proto";
option optimize_for = LITE_RUNTIME;
option go_package = "./romsg";
option cc_generic_services = false;

enum MovementType {
  MoveTypeNone = 0;
  MoveTypeWalk = 1;
  MoveTypeMove = 2;
  MoveTypeAroundPoint = 3;
  MoveTypeAroundObject = 4;
  MoveTypeTrace = 5;
  MoveTypeArchimedeanSpiral = 6;
  MoveTypeEquiangularSpiral = 7;
  MoveTypeMax = 8;
}

enum MovementTransitionType {
  MoveTransNormal = 0;
  MoveTransResetPos = 1;
  MoveTransForceTeleport = 2;
  MoveTransServerControl = 3;
  MoveTransBlockPush = 4;
  MoveTransJumpWall = 5;
  MoveTransFallDown = 6;
  MoveTransBeCarriedMove = 7;
  MoveTransFlyUp = 8;
  MoveTransLanding = 9;
  MoveTransCollectionDrop = 10;
  MoveTransFreeFall = 11;
  MoveTransFixClientLand = 12;
}

enum MiniMapInfoSpecialType {
  SpecialTypeNone = 0;
  SpecialTypeEscortCart = 1;
}

enum SceneTeleportReasonType {
  SceneTeleportReason_None = 0;
  SceneTeleportReason_Task = 1;
  SceneTeleportReason_TerritoryWar = 2;
  SceneTeleportReason_TaskOnlyTemp = 3;
  SceneTeleportReason_CliLeaveAuto = 4;
}

enum SwitchSceneReasonType {
  SwitchSceneReason_Normal = 0;
  SwitchSceneReason_SwitchLine = 1;
  SwitchSceneReason_TeamRally = 2;
  SwitchSceneReason_EnterDungeon = 3;
  SwitchSceneReason_ClimbTowerStart = 4;
  SwitchSceneReason_ConfirmTeamDungeon = 5;
  SwitchSceneReason_Gmproc = 6;
  SwitchSceneReason_Login = 7;
  SwitchSceneReason_Convene = 8;
  SwitchSceneReason_CrossCluster = 9;
  SwitchSceneReason_SwitchRole = 10;
  SwitchSceneReason_TeamFollow = 11;
  SwitchSceneReason_HeroicSpirit = 12;
}

enum SwitchSceneSourceType {
  SwitchSceneSourceNone = 0;
  SwitchSceneSourceFollow = 1;
  SwitchSceneSourceManual = 2;
}

enum ForceFieldType {
  ForceFieldNone = 0;
  Target = 1;
  Direction = 2;
}

enum DUNGEON_STATE {
  DUNGEON_STATE_NULL = 0;
  DUNGEON_STATE_PRE_ACTIVE = 1;
  DUNGEON_STATE_ACTIVE = 2;
  DUNGEON_STATE_CLIENT_READY = 3;
  DUNGEON_STATE_PRE_START = 4;
  DUNGEON_STATE_START = 5;
  DUNGEON_STATE_PRE_END = 6;
  DUNGEON_STATE_END = 7;
  DUNGEON_STATE_PRE_DESTORY = 8;
  DUNGEON_STATE_DESTORY = 9;
}

