syntax = "proto3";
package romsg;
import "FieldOption.proto";
option optimize_for = LITE_RUNTIME;
option go_package = "./romsg";
option cc_generic_services = false;

message FunctionList {
  repeated int32 functions = 1 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
}

message SeasonPageHonorBadgeData {
  int64 id = 1 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  int64 getTime = 2 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  int64 getSeasonId = 3 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  int64 getPlayBookId = 4 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
  bool isPutOn = 5 [(romsg.save) = 1, (romsg.self) = 1, (romsg.other) = 0];
}

message SeasonPageHistoryFunctionScoreData {
  map<int64, int64> functionScore = 1;
}

message SeasonPageGetDataReq {
}

message SeasonPageGetDataResp {
  int32 result = 1;
  int64 stageID = 2;
  map<int32, int64> rankScore = 3;
}

message SeasonPageReceiveRankRewardReq {
  map<int32, int32> rankReward = 1;
}

message SeasonPageReceiveRankRewardResp {
  int32 result = 1;
  map<int32, int32> receiveResult = 2;
}

message SeasonPagePutOnHonorBadgeReq {
  int32 id = 1;
  bool isPutOn = 2;
}

message SeasonPagePutOnHonorBadgeResp {
  int32 result = 1;
}

message BattleGloryRankRewardReq {
  map<int32, int32> rankReward = 1 [(romsg.max_count) = 100];
}

message BattleGloryRankRewardResp {
  int32 result = 1;
  map<int32, int32> receiveResult = 2;
}

