syntax = "proto3";
package romsg;
import "MG_DB.proto";
import "FieldOption.proto";
option optimize_for = LITE_RUNTIME;
option go_package = "./romsg";
option cc_generic_services = false;

message PopupImageReq {
  string language = 1;
  string channel = 2;
}

message PopupImageResInfo {
  int32 rank = 1;
  string startTime = 2;
  romsg.PopupImage imageInfo = 3;
  int64 popImageId = 4;
  string title = 5;
}

message PopupImageRes {
  repeated romsg.PopupImageResInfo images = 1;
}

