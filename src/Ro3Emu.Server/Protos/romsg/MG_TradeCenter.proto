syntax = "proto3";
package romsg;
import "MG_Common.proto";
import "FieldOption.proto";
option optimize_for = LITE_RUNTIME;
option go_package = "./romsg";
option cc_generic_services = false;

enum ETradeItemSpecialType {
  ETradeItemSpecialType_None = 0;
  ETradeItemSpecialType_NotAppraisal = 1;
  ETradeItemSpecialType_Appraisal = 2;
  ETradeItemSpecialType_NotCollection = 3;
  ETradeItemSpecialType_Collection = 4;
}

enum TradeSearchType {
  TradeSearchType_None = 0;
  TradeSearchType_Job = 1;
  TradeSearchType_Grade = 2;
  TradeSearchType_Quality = 3;
  TradeSearchType_Part = 4;
  TradeSearchType_SkillNum = 5;
  TradeSearchType_SpSkills = 6;
  TradeSearchType_BaseAttr = 7;
  TradeSearchType_Entry = 8;
  TradeSearchType_SubType = 9;
  TradeSearchType_Apprise = 10;
  TradeSearchType_Score = 11;
  TradeSearchType_Price = 12;
  TradeSearchType_Type = 13;
}

enum TradeAttionType {
  tradeAttionType_None = 0;
  tradeAttionType_ItemId = 1;
  tradeAttionType_SkuId = 2;
}

enum PreTradeStatusEnums {
  PreTradeStatusEnums_Init = 0;
  PreTradeStatusEnums_Offline = 1;
  PreTradeStatusEnums_Success = 2;
  PreTradeStatusEnums_Refunded = 3;
  PreTradeStatusEnums_ExceptionNotNotified = 4;
  PreTradeStatusEnums_NotSelected = 5;
}

