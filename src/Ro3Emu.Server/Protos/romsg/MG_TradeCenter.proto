service ProductService {
  rpc CountProductByParamWithPage (romsg.SCountQueryProductByParamRequest) returns (romsg.CCountItemInTradeByParamResponse);
  rpc QueryProductByParamWithPage (romsg.SQueryProductByParamRequest) returns (romsg.CQueryProductByParamWithPageResp);
  rpc QueryItemInventoryInfoByItemId (romsg.QueryItemInventoryInfoByItemIdRequest) returns (romsg.ItemInventoryInfoByItemIdResponse);
  rpc FindItemPrice (romsg.FindItemPriceRequest) returns (romsg.FindItemPriceResponse);
  rpc BuyTradeInfoWithUser (romsg.QueryBuyTradeInfoRequest) returns (romsg.BuyTradeInfoResponse);
  rpc SaleTradeInfoWithUser (romsg.CQuerySaleTradeInfoRequest) returns (romsg.CSaleTradeInfoResponse);
  rpc QueryPlayerBoothInfo (romsg.QueryPlayerBoothInfoRequest) returns (romsg.CQueryPlayerBoothInfoResp);
  rpc FindUserCreditScore (romsg.CFindUserCreditScoreRequest) returns (romsg.CFindUserCreditScoreResponse);
  rpc FindSpuRecentTransationPrice (romsg.CFindSpuRecentTransationPriceRequest) returns (romsg.CFindSpuRecentTransationPriceResponse);
  rpc SearchTopProps (romsg.CSearchTopPropsRequest) returns (romsg.CSearchTopPropsResp);
  rpc QueryAllItemInventoryInfoByItemId (romsg.CQueryAllItemInventoryInfoByItemIdRequest) returns (romsg.CAllItemInventoryInfoByItemIdResponse);
  rpc QueryProductBySkuId (romsg.QueryProductBySkuIdReq) returns (romsg.CQueryProductBySkuIdResp);
  rpc ChangeSkuPrice (romsg.ChangeSkuPriceReq) returns (romsg.ChangeSkuPriceResp);
  rpc QueryPenaltyOrders (romsg.CQueryPenaltyOrdersRequest) returns (romsg.CQueryPenaltyOrdersResponse);
  rpc TtTradeGetAllPreTradeTop (romsg.CPreTradeTopQueryRequest) returns (romsg.CPreTradeTopQueryResponse);
}

