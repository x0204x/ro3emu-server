syntax = "proto3";
package romsg;
option optimize_for = LITE_RUNTIME;
option go_package = "./romsg";
option cc_generic_services = false;

message EquipSocialOutfitReq {
  int64 cfgId = 1;
  int64 type = 2;
}

message EquipSocialOutfitRes {
  int32 err = 1;
}

message RefreshSocialOutfitReq {
}

message RefreshSocialOutfitRes {
  int32 err = 1;
}

