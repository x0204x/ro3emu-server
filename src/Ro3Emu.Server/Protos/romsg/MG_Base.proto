syntax = "proto3";
package romsg;
import "MG_Define.proto";
option optimize_for = LITE_RUNTIME;
option go_package = "./romsg";
option cc_generic_services = false;

message BaseMsg {
  romsg.MSG_Type msgType = 1;
  bytes data = 2;
}

message BaseMsgPlayerLoginReq {
  int64 playerID = 1;
}

message BaseMsgPlayerLogoutReq {
  int32 reason = 1;
}

