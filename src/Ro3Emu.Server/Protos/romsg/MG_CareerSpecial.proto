syntax = "proto3";
package romsg;
option optimize_for = LITE_RUNTIME;
option go_package = "./romsg";
option cc_generic_services = false;

message LeaseCareerSpecialItemReq {
  int32 cartRemouldCfgId = 1;
}

message CancelLeaseCareerSpecialItemReq {
  int32 cartRemouldCfgId = 1;
}

message LeaseCareerSpecialItemRsp {
  int32 errCode = 1;
}

message CancelLeaseCareerSpecialItemRsp {
  int32 errCode = 1;
}

