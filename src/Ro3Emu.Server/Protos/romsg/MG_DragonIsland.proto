syntax = "proto3";
package romsg;
import "MG_Define.proto";
import "MG_Common.proto";
option optimize_for = LITE_RUNTIME;

message DragonIslandClaimRankRewardReq {
}

message DragonIslandClaimRankRewardRes {
  int32 error_code = 1;
}

message DragonIslandSettleNtf {
  int32 result_type = 1;
  int64 base_protect = 2;
  int64 behavior_protect = 3;
  int64 consecutive_protect = 4;
  int64 calculated_protect_total = 5;
  int64 actual_protect_grant = 6;
  int64 protect_consumed = 7;
  bool protect_capped = 14;
  int64 net_score_delta = 8;
  bool rank_dropped = 9;
  int32 old_rank_id = 10;
  int32 new_rank_id = 11;
  int64 new_net_score = 12;
  int64 new_protect_score = 13;
  bool is_negative_play = 15;
  romsg.DungeonResultInfo snapshot = 16;
  int64 old_net_score = 17;
  int64 old_protect_score = 18;
  int64 currency_earned = 19;
}

