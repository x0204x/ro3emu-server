syntax = "proto3";
package romsg;
option optimize_for = LITE_RUNTIME;
option go_package = "./romsg";
option cc_generic_services = false;

message RainbowKoiInitData {
  repeated int64 candidate_player_ids = 1;
  repeated int32 question_ids = 2;
  string activity_key = 3;
  int64 activity_instance = 4;
}

